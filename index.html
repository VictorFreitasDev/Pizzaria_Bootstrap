<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="assets/styles/estilo.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PizzouAi?</title>
</head>
<body>
    <!-- MENU -->
    <!-- 
        navbar - barra de navegação do bootstrap
        navbar-expand-lg - controla a responsividade. a partir de telas lg(large),
        o menu fica abrto/horizontal. abaixo dele, fica recolhido o botão sanduiche
        bg-danger - cor de fundo do menu.
        navbar-dark - cor do texto do menu. como o fundo é escuro, o texto fica claro.
        shadow - adiciona sombra ao menu.
    -->
     <nav class="navbar navbar-expand-lg bg-danger navbar-dark shadow">
        <div class="container">
            <!-- 
             navbar-brand - marca do menu.
             fw-bold - texto em negrito.
             fs-4 - tamanho da fonte.
            -->
            <a class="navbar-brand fw-bold fs-4" href="#">PizzouAi?</a>
        
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <!--
             navbar-nav - lista de itens do menu.
             ms-auto - alinha os itens do menu à direita.
             collapse - recolhe o menu em telas menores.
            -->
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="#inicio">Início</a></li>
                    <li class="nav-item"><a class="nav-link " href="#pizzas">Pizzas</a></li>
                    <li class="nav-item"><a class="nav-link " href="#sobre">Sobre</a></li>
                    <li class="nav-item"><a class="nav-link " href="#contato">Contato</a></li>

                </ul>    
            </div>
            
        </div>

     </nav>

     <!--
     bg-light- coloca um fundo claro
     py-5 - adciona espaçamento interno (padding) em cima e embaixo
     -->
     <section class = "bg-light py-5">
        <!--
        row - cria uma linha do sistema grid do bootstrap
        align-items-center - centraliza verticalmente os elementos que serão dentro da linha
        -->
        <div class="container">
            <div class="row align-items-center">
                <!--
                col-md-6 - cria uma coluna que ocua 6 das 12 partes do grrid a partir de telas médias (md)
                grid possui 12 colunas, então 6 = 50%
                -->
                <div class="col-md-6">
                    <!--
                    Display-4 aplica um tamanho grande de destaque ao texto
                    fw-bold - deixa o texto em negrito
                    -->
                    <h1 class="display-5 fw-bold"> A Melhor pizza da cidade</h1>

                    <p class="lead">
                        Pizzas artesanais preparadas com ingredientes selecionados
                        pelo pŕoprio Ratatouille e muito sabor.
                    </p>


                    <a href="#pizzas" class="btn btn-danger btn-lg">
                        Ver Cardápio
                    </a>
                </div>

                <!--
                col-md-6 - ocupa as outras 6 colunas do Grid
                text-center - centraliza o conteúdo/texto
                mt-4 - adiciona margem superior
                mt-md-0 - a partir de telas md, remove a margem superior
                Isso é util porque no celular a aimagem ficará abaixo do texto e precisará
                de um espaço entre eles
                -->
                <div class="col-md-6 text-center mt-4 mt-md-0">
                    <!-- 
                    img-fluid - torna a imagem responsiva.
                    A imagem diminui de acordo com o tamanho disponível.
                    rouded - deixa os cantos da imagem arredondados.
                    shadow - adiciona uma sombra.
                    -->
                    <img src="assets/imgs/pizzasss.png" alt="Imagem de pizza" class="img-fluid rounded shadow">
                </div>

            </div>
        </div>
        
     </section>
</body>
</html>
